<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>CLUB ADSO</title>
         <link rel="stylesheet" href="../Assets/EstiloLogin.css">
    </head>

    <body>
        <div class="Container-Login">
            <h2>Iniciar Sesión Accerías</h2>

            <form id="FormuLogin" action="" method="POST">
                <div class="grupo-input">
                    <label for="email">Correo Electrónico: </label>
                    <input type="email" id="email" required placeholder="Ingresa Tu Correo Electrónico">
                </div>

                <div class="grupo-input">
                    <label for="Password">Contraseña: </label>
                    <input type="password" id="Password" required placeholder="Ingresa Tu Contraseña">
                </div>
                <div class="grupo-botones">
                    <button type="submit">Ingresar</button>
                    <button type="reset" class="btn-secundario">cancelar</button>
                </div>

                <p class="texto-link">
                    ¿No tienes una cuenta? <a href="Registro.html">Regístrate aquí</a>
                </p>
            </form>
        </div>
    </body>
    <script src="../Controlador/Login.js"></script>
</html>
