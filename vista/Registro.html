<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <title>MR-CLUB</title>
        <link rel="stylesheet" href="../Assets/EstiloFormulario.css">
    </head>

    <body>
     <div class="Contenedor-Formulario">
        <h2>Registro de Asociado - Acerias</h2>

        <form id="FormularioRegistro" action="../Modelo/GuardarAsociado.php" method="POST">
            <div class="grupo-input">
                <label>Ingresar Documento: </label>
                <input id="Documento" name="documento" type="number" placeholder="ejemplo:1054869578" >
            </div>
            <div class="grupo-input">
                <label>Ingresar Nombres: </label>
                <input type="text" id="Nombres" name="nombres" required placeholder="Ingrese nombres completos">
            </div>
            <div class="grupo-input">
                 <label>Ingresar Apellidos: </label>
                <input type="text" id="Apellidos" name="apellidos" required placeholder="Ingrese apellidos completos">
            </div>
            <div class="grupo-input">
                <label>Ingrese su fecha de nacimiento:</label>
                <input type="date" id="FechaNacimiento" name="fechaNacimiento" required placeholder ="ejemplo: 30/11/1999">
            </div>
            <div class="grupo-input">
                <label>Dirección De Residencia: </label>
                <input type="text" id="DirecciónDeResidencia" name="direccionResidencia" required placeholder="ejemplo: Calle 12 # 6-49">
            </div>
            <div class="grupo-input">
                <label>Ciudad: </label>
                <select id="Ciudad" name="ciudad" required>
                    <option value="Sogamoso">Sogamoso</option>
                    <option value="Duitama">Duitama</option>
                    <option value="Tunja">Tunja</option>
                </select>
            </div>
            <div class="grupo-input">
                <label>Telefono: </label>
                <input type="number" id="Telefono" name="telefono" required placeholder="ejemplo: 3125847896">
            </div>
            <div class="grupo-input">
                <label>Email: </label>
                <input type="email" id="Email" name="email" required placeholder="ejemplo: valentina@gmail.com">
            </div>
            <div class="grupo-input">
                <label>Contraseña: </label>
                <input type="password" id="Contraseña" name="contraseña" required placeholder="minimo 8 caracteres">
            </div>
            <div class="grupo-input">
                <label>ConfirmarContraseña: </label>
                <input type="password" id="ConfirmarContraseña" name="confirmarContrasena" required placeholder="Confirma tu contraseña">
            </div>
            <div class="grupo-input">
                <label>Genero: </label>
                <label>
                      <input type="radio" id="Femenino" name="genero" value="Femenino" required>
                      <span>FEMENINO</span>
                </label>
                <label>
                      <input type="radio" id="Masculino" name="genero" value="Masculino">
                      <span>MASCULINO</span>
                </label>
                <label>
                      
                      <input type="radio" id="Otro" name="genero" value="Otro">
                      <span>OTRO</span>
                </label>
            </div>
            <div class="grupo-botones">
                <button type="submit">Guardar</button>
                <button type="reset">Limpiar Formulario</button>
            </div>

            <p id="MensajeRegistro" role="status" aria-live="polite"></p>
        </form>
     </div>
    </body>
    <script src="../controlador/Asociado.js"></script>
</html>
