<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>CLUB ADSO</title>
        <link rel="stylesheet" href="..//Assets/EstiloFormulario.css">
    </head>
    <body>
     <div class="Contenedor-Formulario">
        <h2>Registro de Asociado - Acerias</h2>

        <form id="Contenedor-Formulario" action="../Modelo/GuardarAsociado.php" method="POST">
            <div class="grupo-input">
                <label>Ingresar Documento: </label>
                <input id="Documento" type="number" name="documento" required placeholder="ejemplo:1054869578">
            </div>
            <div class="grupo-input">
                <label>Ingresar Nombres: </label>
                <input type="text" id="Nombres" name="nombres" required placeholder="Ingrese nombre completos">
            </div>
            <div class="grupo-input">
                 <label>Ingresar Apellidos: </label>
                <input type="text" id="Apellidos" name="apellidos" required placeholder="Ingrese apellidos completos">
            </div>
            <div class="grupo-input">
                <label>Ingrese su fecha de nacimiento:</label>
                <input type="date" id="FechaNacimiento" name="fechaNacimiento" required placeholder="ejemplo: 19/09/2008">
            </div>
            <div class="grupo-input">
                <label>Dirección De Residencia: </label>
                <input type="text" id="DirecciónDeResidencia" name="direccionResidencia" required placeholder="ejemplo: Calle 12 # 6-49">
            </div>
            <div class="grupo-input">
                <label>Ciudad: </label>
                <Select id="Ciudad" name="ciudad" required>
                    <option value="Sogamoso">Sogamoso</option>
                    <option value="Duitama">Duitama</option>
                    <option value="Tunja">Tunja</option>
                </Select>
            </div>
            <div class="grupo-input">
                <label>Telefono: </label>
                <input type="number" id="Telefono" name="telefono" required placeholder="ejemplo: 3125847896">
            </div>
            <div class="grupo-input">
                <label>Email: </label>
                <input type="text" id="Email" name="email" required placeholder="ejemplo: valeria@gmail.com">
            </div>
            <div class="grupo-input">
                <label>Contraseña: </label>
                <input type="password" id="Contraseña" name="contraseña" required placeholder="minimo 8 caracteres, mayusculas, comas y almenosun caracter especial">
            </div>
            <div class="grupo-input">
                <label>Confirmar Contraseña: </label>
                <input type="password" id="ConfirmarContraseña" name="confirmarcontraseña" required placeholder="Escribe nuevamente tu contraseña para confirmar">
            </div>
            </form>
            <div class="grupo-input">
                <label>Genero: </label>
                <label>
                      <input type="radio" id="Femenino" name="genero" value="Femenino">
                      <span>FEMENINO</span>
                </label>
                <label>
                      <input type="radio" id="Masculino" name="genero" value="Masculino">
                      <span>MASCULINO</span>
                </label>
                <label>
                      <input type="radio" id="Otro" name="genero" values="Otro">
                      <span>OTRO</span>
                </label>
            </div>
            <div class="grupo-botones">
                <button type="submit">Guardar</button>
                <button type="reset">Limpiar Formulario</button>
            </div>

            <P id="MensajeRegistro" role="status" aria-live="polite"></P>
        </form>
     </div>
    </body>
</html>
