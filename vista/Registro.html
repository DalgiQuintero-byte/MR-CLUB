
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Asociados - Club Acerías</title>

    <link rel="stylesheet" href="../Assets/EstiloFormulario.css">
</head>

<body>

    <div class="Contenedor-Formulario">

        <h2>Registro de Asociados</h2>

        <form id="FormularioRegistro">

            <div class="grupo-input">
                <label for="Documento">Documento:</label>
                <input type="text" id="Documento" required
                    placeholder="Ingrese el documento">
            </div>

            <div class="grupo-input">
                <label for="Nombres">Nombres:</label>
                <input type="text" id="Nombres" required
                    placeholder="Ingrese nombres completos">
            </div>

            <div class="grupo-input">
                <label for="Apellidos">Apellidos:</label>
                <input type="text" id="Apellidos" required
                    placeholder="Ingrese apellidos completos">
            </div>

            <div class="grupo-input">
                <label for="FechaNacimiento">Fecha de nacimiento:</label>
                <input type="date" id="FechaNacimiento" required>
            </div>

            <div class="grupo-input">
                <label for="Direccion">Dirección de residencia:</label>
                <input type="text" id="Direccion" required
                    placeholder="Ingrese su dirección">
            </div>

            <div class="grupo-input">
                <label for="Ciudad">Ciudad:</label>
                <select id="Ciudad" required>
                    <option value="">Seleccione una ciudad</option>
                    <option value="Sogamoso">Sogamoso</option>
                    <option value="Duitama">Duitama</option>
                    <option value="Tunja">Tunja</option>
                </select>
            </div>

            <div class="grupo-input">
                <label for="Telefono">Teléfono:</label>
                <input type="tel" id="Telefono" required
                    placeholder="Ejemplo: 3125847896">
            </div>

            <div class="grupo-input">
                <label for="Email">Correo electrónico:</label>
                <input type="email" id="Email" required
                    placeholder="correo@gmail.com">
            </div>

            <div class="grupo-input">
                <label>Género:</label>

                <label>
                    <input type="radio" name="Genero"
                        value="Femenino" required>
                    Femenino
                </label>

                <label>
                    <input type="radio" name="Genero"
                        value="Masculino">
                    Masculino
                </label>

                <label>
                    <input type="radio" name="Genero"
                        value="Otro">
                    Otro
                </label>
            </div>

            <div class="grupo-botones">
                <button type="submit">Guardar asociado</button>
                <button type="reset">Limpiar</button>
            </div>

        </form>

        <p id="mensaje"></p>

        <hr>

        <h2>Asociados registrados</h2>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Documento</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Teléfono</th>
                        <th>Ciudad</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="tablaAsociados"></tbody>
            </table>
        </div>

        <div class="grupo-botones">
            <button type="button"
                onclick="window.location.href='dashboard.html'">
                Volver al panel
            </button>
        </div>

    </div>

    <script src="../Controlador/Registro.js"></script>

</body>
</html>
